version: '3.9'

services:

  myapp:
    image: myapp
    container_name: myapp
    ports:
      - "80:80"
    depends_on:
      - mysql-db
    networks:
      - devops-net

  mysql-db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: devopsdb
    ports:
      - "3306:3306"
    networks:
      - devops-net

    volumes:
      - mysql-data:/var/lib/mysql

networks:
  devops-net:

volumes:
  mysql-data:
