services:

  frontend:
    image: yashrajoria0327/devops-demo-app:${IMAGE_TAG}
    container_name: devops-demo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - devops-net
    restart: unless-stopped

  backend:
    image: yashrajoria0327/devops-demo-backend:${IMAGE_TAG}
    container_name: devops-demo-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    networks:
      - devops-net
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: devops-demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - devops-net
    restart: unless-stopped

networks:
  devops-net:

volumes:
  mysql-data:
    external: true
    name: mysql_data
