name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:

  # -------------------------
  # CI: Build and Push Images
  # -------------------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            yashrajoria0327/devops-demo-app:latest
            yashrajoria0327/devops-demo-app:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            yashrajoria0327/devops-demo-backend:latest
            yashrajoria0327/devops-demo-backend:${{ github.sha }}

  # -------------------------
  # CD: Deploy to AlmaLinux
  # -------------------------
  deploy:
    name: Deploy to AlmaLinux VM
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh ${{ github.sha }}

      - name: Verify application
        run: |
          curl -f http://localhost:8080
          curl -f http://localhost:5000/health
          curl -f http://localhost:5000/api/db-test
