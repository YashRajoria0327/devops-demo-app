name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decode SSH Key
        shell: bash
        run: |
          echo "${{ secrets.EC2_KEY_B64 }}" | base64 -d > private_key
          chmod 600 private_key

          echo "Checking key format..."
          head -2 private_key

      - name: Test SSH Connection
        shell: bash
        run: |
          ssh -vvv -i private_key \
          -o StrictHostKeyChecking=no \
          -o IdentitiesOnly=yes \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            echo 'SSH SUCCESS'
            hostname
            whoami
          "
